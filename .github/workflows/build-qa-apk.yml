name: Relaxia 11.6 QA install APK (not an update)

on:
  push:
    branches:
      - preview/relaxia-116-apk-20261112
  workflow_dispatch:

permissions:
  contents: read

env:
  LAYALI_API_URL: https://165-227-128-113.sslip.io

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Android SDK license setup
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\\n24333f8a63b6825ea9c5514f83c2829b004d1fee\\nd56f5187479451eabf01fb78af6dfcb131a6481e\\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf "\\n84831b9409646a918e30573bab4c9c91346d8abd\\n504667f4c0de7af1a06de9f4b1727b84351f2910" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"

      - name: Prepare non-production build inputs
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          if [ ! -f app/google-services.json ]; then
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "335825631510",
              "project_id": "gen-lang-client-0262570811",
              "storage_bucket": "gen-lang-client-0262570811.firebasestorage.app"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:335825631510:android:c3c9ab3d14056ce9c17837",
                "android_client_info": {"package_name": "com.aistudio.layalilounge.x9m4kp"}
              },
              "api_key": [{"current_key": "AIzaSyAdn0nUzmGACcTw__y_cuDOyLfgnDxQTSY"}]
            }],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Configure separate QA identity in Firebase test metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('app/google-services.json')
          j=json.loads(p.read_text())
          for c in j['client']:
              c['client_info']['android_client_info']['package_name']='com.aistudio.layalilounge.x9m4kp.qa116'
          p.write_text(json.dumps(j))
          PY

      - name: Select stable new signing certificate or disposable QA key
        env:
          RELAXIA_NEXT_KEYSTORE_BASE64: ${{ secrets.RELAXIA_NEXT_KEYSTORE_BASE64 }}
          RELAXIA_NEXT_STORE_PASSWORD: ${{ secrets.RELAXIA_NEXT_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -n "${RELAXIA_NEXT_KEYSTORE_BASE64}" && -z "${RELAXIA_NEXT_STORE_PASSWORD}" ]] || [[ -z "${RELAXIA_NEXT_KEYSTORE_BASE64}" && -n "${RELAXIA_NEXT_STORE_PASSWORD}" ]]; then
            echo '::error::Both protected signing secrets are required together.'
            exit 1
          fi
          if [[ -n "${RELAXIA_NEXT_KEYSTORE_BASE64}" && -n "${RELAXIA_NEXT_STORE_PASSWORD}" ]]; then
            printf '%s' "${RELAXIA_NEXT_KEYSTORE_BASE64}" | base64 -d > relaxia-next.jks
            keytool -list -keystore relaxia-next.jks -storepass "${RELAXIA_NEXT_STORE_PASSWORD}" -alias relaxia_next > /dev/null
            expected=a1ba52b55fe246379bed147a1de23a8e03dc7ad5d3d38b1113d3aa3bcaf0db9c
            actual="$(keytool -exportcert -keystore relaxia-next.jks -storepass "${RELAXIA_NEXT_STORE_PASSWORD}" -alias relaxia_next | sha256sum | cut -d ' ' -f 1)"
            [[ "${actual}" == "${expected}" ]] || { echo '::error::Unexpected QA signing certificate. Stop.'; exit 1; }
            echo 'Verified stable user-owned QA signing certificate.'
          else
            keytool -genkeypair -keystore debug.keystore -storetype JKS \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 60 \
              -dname "CN=Relaxia 11.6 QA Only, OU=QA, O=Relaxia, C=TR"
            echo "::warning::Temporary QA signing certificate in use."
          fi
          echo "::warning::This preview installs beside existing Relaxia. Keep the installed app."

      - name: Build latest 11.6 source APK
        env:
          RELAXIA_NEXT_STORE_PASSWORD: ${{ secrets.RELAXIA_NEXT_STORE_PASSWORD }}
        run: gradle assembleDebug "-PLAYALI_API_URL=${LAYALI_API_URL}" -PRELAXIA_QA_SIDE_BY_SIDE=true --no-daemon --stacktrace

      - name: Verify exact app ID, version and signing
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('app/build/outputs/apk/debug/output-metadata.json').read_text())
          assert data['applicationId']=='com.aistudio.layalilounge.x9m4kp.qa116'
          assert all(item['versionCode']==33 for item in data['elements'])
          print('Relaxia 11.6 source APK validated (fresh-install-only QA signature)')
          PY
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Relaxia-v11.6-SIDE-BY-SIDE.apk
          cat > READ-ME-FIRST.txt <<'EOF'
          RELAXIA 11.6 QA BUILD ONLY
          Package ID: com.aistudio.layalilounge.x9m4kp.qa116
          Version: 11.6 (code 33)
          Signed with a separate QA key, NOT the original production key.
          THIS APK INSTALLS SIDE-BY-SIDE WITH THE EXISTING RELAXIA APP.
          DO NOT UNINSTALL YOUR EXISTING RELAXIA APP OR YOU MAY LOSE LOCAL DATA.
          Without stable secrets this is an ephemeral QA signature and future QA builds cannot update it.
          Firebase push may require registering the QA application ID.
          This build is for QA testing, not a public update.
          To release an upgrade, recover the original signing keystore and rerun the official protected build-apk workflow.
          EOF

      - name: Upload preview and safety instructions
        uses: actions/upload-artifact@v4
        with:
          name: Relaxia-v11.6-QA-SIDE-BY-SIDE
          path: |
            Relaxia-v11.6-SIDE-BY-SIDE.apk
            READ-ME-FIRST.txt
          retention-days: 7
          if-no-files-found: error
