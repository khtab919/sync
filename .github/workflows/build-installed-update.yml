name: Build Relaxia 11.7.3 compatible update

on:
  push:
    branches:
      - fix/live-controls-reels-20261116
  workflow_dispatch:

permissions:
  contents: read

env:
  LAYALI_API_URL: https://165-227-128-113.sslip.io
  PRODUCTION_PACKAGE: com.aistudio.layalilounge.x9m4kp

jobs:
  compatible-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Android SDK licenses
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"

      - name: Prepare original-package Firebase metadata
        run: |
          if [ ! -f .env ]; then cp .env.example .env 2>/dev/null || touch .env; fi
          if [ ! -f app/google-services.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          doc = {
            "project_info": {
              "project_number": "335825631510",
              "project_id": "gen-lang-client-0262570811",
              "storage_bucket": "gen-lang-client-0262570811.firebasestorage.app"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:335825631510:android:c3c9ab3d14056ce9c17837",
                "android_client_info": {"package_name": "com.aistudio.layalilounge.x9m4kp"}
              },
              "api_key": [{"current_key": "AIzaSyAdn0nUzmGACcTw__y_cuDOyLfgnDxQTSY"}],
              "oauth_client": [{
                "client_id": "335825631510-phs602etm4vsum7vju7gmgjic1nuh4de.apps.googleusercontent.com",
                "client_type": 3
              }]
            }],
            "configuration_version": "1"
          }
          Path('app/google-services.json').write_text(json.dumps(doc))
          PY
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path("app/google-services.json").read_text())
          ids={client["client_info"]["android_client_info"]["package_name"] for client in doc["client"]}
          assert "com.aistudio.layalilounge.x9m4kp" in ids, "Original Firebase application ID missing"
          assert not any(x.endswith(".qa116") for x in ids), "QA application would be a different install"
          print("Original application identity validated")
          PY

      - name: Run Android UI and unit tests (no external Firebase emulator)
        run: |
          gradle testDebugUnitTest \
            --tests com.example.ui.auth.AdultWelcomeScreenTest \
            --tests com.example.ui.screens.ReferenceDesignTest \
            --tests com.example.data.api.SecureSessionStoreTest \
            --no-daemon --stacktrace

      - name: Compile original-package non-debuggable release
        run: |
          gradle assembleRelease "-PLAYALI_API_URL=${LAYALI_API_URL}" \
            -PRELAXIA_UNSIGNED_BUILD=true --no-daemon --stacktrace

      - name: Validate original package and release metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          meta=json.loads(Path("app/build/outputs/apk/release/output-metadata.json").read_text())
          assert meta["applicationId"] == "com.aistudio.layalilounge.x9m4kp", "Package identity changed"
          assert all(x["versionCode"] == 41 and x["versionName"] == "11.7.3" for x in meta["elements"])
          apk=Path("app/build/outputs/apk/release/app-release-unsigned.apk")
          assert apk.is_file() and apk.stat().st_size > 1_000_000
          PY
          tools_dir="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1 | xargs dirname)"
          "$tools_dir/aapt" dump badging app/build/outputs/apk/release/app-release-unsigned.apk > release-badging.txt
          if grep -q 'application-debuggable' release-badging.txt; then
            echo "::error::Release must not be debuggable"; exit 1
          fi
          grep -F "package: name='com.aistudio.layalilounge.x9m4kp'" release-badging.txt

      - name: Require original signing key for same-app installation
        env:
          RELAXIA_KEYSTORE_BASE64: ${{ secrets.RELAXIA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$RELAXIA_KEYSTORE_BASE64" ]; then
            echo "::error::Cannot issue a compatible APK: original signing key is not configured. Never replace it or change package ID."
            exit 1
          fi
          umask 077
          printf '%s' "$RELAXIA_KEYSTORE_BASE64" | base64 -d > original-relaxia.keystore
          actual="$(keytool -exportcert -keystore original-relaxia.keystore -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)"
          expected='eadf736b5beaa7fa9395c633b83ab9a0892126219ef3f05ae59eb511465c501f'
          if [ "$actual" != "$expected" ]; then
            echo "::error::Original 11.3 signing certificate mismatch. A different signature cannot update the installed app."
            exit 1
          fi

      - name: Sign, verify and export real APK for original app
        run: |
          set -euo pipefail
          tools_dir="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1 | xargs dirname)"
          "$tools_dir/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            Relaxia-11.7.3-aligned.apk
          "$tools_dir/apksigner" sign \
            --ks original-relaxia.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out Relaxia-11.7.3.apk \
            Relaxia-11.7.3-aligned.apk
          "$tools_dir/apksigner" verify --verbose --print-certs Relaxia-11.7.3.apk
          "$tools_dir/zipalign" -c -v 4 Relaxia-11.7.3.apk
          "$tools_dir/aapt" dump badging Relaxia-11.7.3.apk | grep -F "package: name='com.aistudio.layalilounge.x9m4kp'"
          cert="$("$tools_dir/apksigner" verify --print-certs Relaxia-11.7.3.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          test "$cert" = "eadf736b5beaa7fa9395c633b83ab9a0892126219ef3f05ae59eb511465c501f"
          sha256sum Relaxia-11.7.3.apk > Relaxia-11.7.3.SHA256

      - name: Upload installable update ONLY after successful signature verification
        uses: actions/upload-artifact@v4
        with:
          name: Relaxia-11.7.3-original-app-signed
          path: |
            Relaxia-11.7.3.apk
            Relaxia-11.7.3.SHA256
          retention-days: 14
          if-no-files-found: error

      - name: Remove temporary signing material
        if: always()
        run: rm -f original-relaxia.keystore
