name: Backend security and finance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions
      - run: npx firebase emulators:exec --project demo-layali --config ../firebase.json --only firestore,auth,storage "npm run test:integration"
        working-directory: functions
