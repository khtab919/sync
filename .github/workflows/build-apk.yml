name: Build Layali APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      api_url:
        description: 'HTTPS origin for the self-hosted API'
        required: false
        type: string


env:
  LAYALI_API_URL: ${{ inputs.api_url || vars.LAYALI_API_URL || 'https://165-227-128-113.sslip.io' }}

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create default .env if missing
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi

      - name: Create google-services.json if missing
        run: |
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "335825631510",
              "project_id": "gen-lang-client-0262570811",
              "storage_bucket": "gen-lang-client-0262570811.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:335825631510:android:c3c9ab3d14056ce9c17837",
                  "android_client_info": {
                    "package_name": "com.aistudio.layalilounge.x9m4kp"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "335825631510-ikkospdenrk7g05u6rihldpdjf31076c.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.aistudio.layalilounge.x9m4kp",
                      "certificate_hash": "0a01050628b01e8c227bbcac2d754c2b0311ea22"
                    }
                  },
                  {
                    "client_id": "335825631510-phs602etm4vsum7vju7gmgjic1nuh4de.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyAdn0nUzmGACcTw__y_cuDOyLfgnDxQTSY"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "335825631510-phs602etm4vsum7vju7gmgjic1nuh4de.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Prepare Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Test adult access age boundaries
        run: gradle testDebugUnitTest --tests com.example.ui.auth.AdultWelcomeScreenTest --tests com.example.ui.screens.ReferenceDesignTest --tests com.example.data.api.SecureSessionStoreTest --no-daemon

      - name: Upload native design previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Relaxia-native-previews
          path: app/build/reference-previews/*.png
          if-no-files-found: ignore

      - name: Build Debug APK
        run: gradle assembleDebug "-PLAYALI_API_URL=${LAYALI_API_URL}" --no-daemon --stacktrace

      - name: Copy APK with Friendly Name
        run: cp app/build/outputs/apk/debug/app-debug.apk Relaxia-v10.3.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Relaxia-v10.3-APK
          path: Relaxia-v10.3.apk

      - name: Publish Direct APK to GitHub Releases
        # Only main-branch builds may publish an installable release.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.LAYALI_API_URL != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v10.3.${{ github.run_number }}
          name: "تطبيق Relaxia - إصدار 10.3 (APK جاهز للتثبيت)"
          body: "اضغط على ملف **Relaxia-v10.3.apk** بالأسفل لتحميل وتثبيت التطبيق مباشرة على هاتفك."
          files: Relaxia-v10.3.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
