name: Verify unsigned production APK identity (not for installation)
on:
  push:
    branches:
      - design/relaxia-soft-luxury-20261113
    paths:
      - app/**
      - .github/workflows/build-unsigned-production-recovery.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  LAYALI_API_URL: https://165-227-128-113.sslip.io
jobs:
  assemble-unsigned-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Android SDK license setup
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\\n24333f8a63b6825ea9c5514f83c2829b004d1fee\\nd56f5187479451eabf01fb78af6dfcb131a6481e\\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
      - name: Prepare nonproduction test-only Firebase metadata
        run: |
          if [ ! -f .env ]; then cp .env.example .env 2>/dev/null || touch .env; fi
          if [ ! -f app/google-services.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          values={
            "project_info":{"project_number":"335825631510","project_id":"gen-lang-client-0262570811","storage_bucket":"gen-lang-client-0262570811.firebasestorage.app"},
            "client":[{
              "client_info":{"mobilesdk_app_id":"1:335825631510:android:c3c9ab3d14056ce9c17837","android_client_info":{"package_name":"com.aistudio.layalilounge.x9m4kp"}},
              "api_key":[{"current_key":"AIzaSyAdn0nUzmGACcTw__y_cuDOyLfgnDxQTSY"}],
              "oauth_client":[{"client_id":"335825631510-phs602etm4vsum7vju7gmgjic1nuh4de.apps.googleusercontent.com","client_type":3}]
            }],
            "configuration_version":"1"
          }
          Path('app/google-services.json').write_text(json.dumps(values))
          PY
          fi
      - name: Compile unsigned production release with ORIGINAL package ID
        run: gradle assembleRelease "-PLAYALI_API_URL=${LAYALI_API_URL}" -PRELAXIA_UNSIGNED_BUILD=true --no-daemon --stacktrace
      - name: Validate production package and deliberately missing signature
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,zipfile
          meta=json.loads(Path('app/build/outputs/apk/release/output-metadata.json').read_text())
          assert meta['applicationId']=='com.aistudio.layalilounge.x9m4kp', "Production package identity must not change"
          assert all(x['versionCode']==39 for x in meta['elements'])
          out=Path('app/build/outputs/apk/release/app-release-unsigned.apk')
          assert out.is_file() and out.stat().st_size>1000000
          with zipfile.ZipFile(out) as archive:
            names=archive.namelist()
            assert 'AndroidManifest.xml' in names
            assert not any(n.upper().startswith('META-INF/') and (n.upper().endswith('.RSA') or n.upper().endswith('.DSA')) for n in names)
          digest=hashlib.sha256(out.read_bytes()).hexdigest()
          print('Production applicationId checked; UNSIGNED release only; sha256='+digest)
          Path('SIGNING-REQUIRED.txt').write_text(
            "NOT INSTALLABLE. NOT AN APP UPDATE.\\n"
            "Production package: com.aistudio.layalilounge.x9m4kp\\n"
            "Version: 11.7.1 (38)\\n"
            "This unsigned APK requires the ORIGINAL production private keystore.\\n"
            "Never generate or substitute a new signing identity to update an installed app.\\n"
            "The GitHub production build workflow stops safely when its key is unavailable.\\n"
            "Original 11.3 certificate SHA256: eadf736b5beaa7fa9395c633b83ab9a0892126219ef3f05ae59eb511465c501f\\n"
            "CI test metadata is not proof of production signing or deployment.\\n"
            "SHA256 unsigned build: "+digest+"\\n"
          )
          PY
          cp app/build/outputs/apk/release/app-release-unsigned.apk Relaxia-11.7.1-PRODUCTION-UNSIGNED-NOT-INSTALLABLE.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Relaxia-11.7-Production-Signing-Required
          path: |
            Relaxia-11.7.1-PRODUCTION-UNSIGNED-NOT-INSTALLABLE.apk
            SIGNING-REQUIRED.txt
          retention-days: 7
