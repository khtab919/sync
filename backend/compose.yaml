name: layali
services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    image: layali-api
    build: .
    environment:
      MEDIA_PROBE_ENABLED: "1"
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
  live-api:
    image: layali-api
    restart: unless-stopped
    env_file: .env
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2", "--threads", "4", "--timeout", "45", "--access-logfile", "-"]
    depends_on:
      db: {condition: service_healthy}
  turn:
    image: coturn/coturn:4.18.0
    restart: unless-stopped
    network_mode: host
    env_file: .env
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        test -n "$${LAYALI_TURN_SECRET:-}" && test -n "$${LAYALI_TURN_PUBLIC_IP:-}" &&
        exec turnserver --log-file=stdout --simple-log --fingerprint
        --listening-port=3478 --listening-ip=0.0.0.0
        --external-ip="$${LAYALI_TURN_PUBLIC_IP}" --relay-ip="$${LAYALI_TURN_PUBLIC_IP}"
        --realm="$${LAYALI_DOMAIN}"
        --use-auth-secret --static-auth-secret="$${LAYALI_TURN_SECRET}"
        --min-port=49160 --max-port=49200 --no-tls
        --no-multicast-peers --no-tcp-relay --user-quota=8 --total-quota=160
        --max-bps=250000 --bps-capacity=10000000
        --denied-peer-ip=0.0.0.0-0.255.255.255
        --denied-peer-ip=10.0.0.0-10.255.255.255
        --denied-peer-ip=127.0.0.0-127.255.255.255
        --denied-peer-ip=169.254.0.0-169.254.255.255
        --denied-peer-ip=172.16.0.0-172.31.255.255
        --denied-peer-ip=192.168.0.0-192.168.255.255
        --denied-peer-ip=::1
        --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
        --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    volumes:
      - ./livekit.generated.yaml:/etc/livekit.yaml:ro
    ports:
      - '7881:7881/tcp'
      - '50000-50100:50000-50100/udp'
    logging:
      options: {max-size: "5m", max-file: "2"}
  live-maintenance:
    image: layali-api
    restart: unless-stopped
    env_file: .env
    command: ["python", "manage.py", "reconcile_live", "--loop"]
    depends_on:
      db: {condition: service_healthy}
      livekit: {condition: service_started}
  push-worker:
    image: layali-api
    restart: unless-stopped
    env_file: .env
    command: ["python", "manage.py", "deliver_push", "--loop"]
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      db: {condition: service_healthy}
  proxy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - live-api
volumes:
  media_data:
  postgres_data:
  static_data:
  caddy_data:
  caddy_config:
