<!doctype html><html lang="ar" dir="rtl" data-theme="{{ theme|default:'dark' }}"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>اتصال Relaxia</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(165deg,#153e53,#101820 75%);color:#f4f7f9;font-family:system-ui,sans-serif;height:100dvh;overflow:hidden}#remote{position:absolute;width:100%;height:100%;object-fit:cover;background:transparent;opacity:0;transition:opacity .2s}body.video.connected #remote{opacity:1}#shade{position:absolute;inset:0;background:linear-gradient(#10182088,transparent 40%,#101820e8);pointer-events:none}#local{position:absolute;top:74px;left:16px;width:25%;max-height:24%;border-radius:18px;object-fit:cover;border:1px solid #70848f66;transform:scaleX(-1);display:none}#identity{position:absolute;top:24%;left:12%;right:12%;text-align:center}#portrait{display:grid;place-items:center;position:relative;margin:0 auto 24px;width:min(40vw,164px);aspect-ratio:1;border:1px solid #70848f;border-radius:50%;background:#1c2933;overflow:hidden}#portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#initial{font-size:48px}#peerName{font-size:26px;font-weight:650;overflow-wrap:anywhere}#state{margin:14px 0 0;text-align:center;font-size:17px;color:#a3b1ba}#timer{font-size:18px;font-variant-numeric:tabular-nums;min-height:30px;margin-top:10px;color:#f4f7f9}body.video.connected #identity{top:18px;left:25%;right:25%}body.video.connected #portrait{display:none}body.video.connected #peerName{font-size:19px}body.video.connected #state{font-size:13px;margin:6px 0}body.video.connected #timer{font-size:15px;margin:4px 0}#controls{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:14px;right:14px;display:flex;justify-content:center;align-items:flex-start;gap:12px;flex-wrap:wrap}button{border:0;color:#f4f7f9;background:none;font:inherit;cursor:pointer;padding:0;display:flex;align-items:center;flex-direction:column;gap:9px;min-width:56px;font-size:12px}button .disc{border:1px solid #70848f55;background:#273b4855;display:grid;place-items:center;width:54px;height:54px;border-radius:50%;transition:background .15s}button[aria-pressed="true"] .disc{background:#3187a8}button:disabled{opacity:.4}button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}#hangup .disc{background:#ad4652;border-color:#bd6770}#resume{display:none;position:absolute;bottom:135px;left:30%;right:30%;padding:10px;background:#153e53;border-radius:16px}#camera,#switch{display:none}@media(max-height:520px){#identity{top:12%}#portrait{width:80px;margin-bottom:8px}#peerName{font-size:20px}#controls{bottom:10px}button .disc{width:44px;height:44px}}

html[data-theme="light"] body{background:#F4F8FA;color:#202D36}html[data-theme="light"] header{background:linear-gradient(#F4F8FAee,transparent)}html[data-theme="light"] footer{background:linear-gradient(transparent,#F4F8FAee)}html[data-theme="light"] #status,html[data-theme="light"] #state{color:#153E53}html[data-theme="light"] #messages p{background:#FFFFFFe8;color:#202D36;text-shadow:none}html[data-theme="light"] input{background:#FFFFFF;color:#202D36;border-color:#788792}html[data-theme="light"] #ended{background:#F4F8FAef;color:#202D36}html[data-theme="light"] #participants{background:#FFFFFF;color:#202D36}html[data-theme="light"] #portrait{background:#DCECF2;border-color:#277C9D}html[data-theme="light"] #shade{background:linear-gradient(#F4F8FA88,transparent 40%,#F4F8FAdd)}html[data-theme="light"] #timer{color:#153E53}html[data-theme="light"] button{color:#153E53}html[data-theme="light"] #actions button,html[data-theme="light"] #composer button{background:#277C9D;color:#FFFFFF}html[data-theme="light"] #hangup{color:#FFFFFF}

/* Relaxia call v2.4: pure presentation; WebRTC signaling remains unchanged. */
body{background:radial-gradient(ellipse at 50% 28%,#34202a 0%,#16151c 62%,#090e14 100%)}
#ambientBackdrop{position:absolute;inset:-25px;overflow:hidden;pointer-events:none;z-index:0}
#ambientImg{position:absolute;width:150%;height:150%;inset:-25%;object-fit:cover;filter:blur(72px) brightness(.34);opacity:.38}
#remote{z-index:1;background:#07090c}
#shade{z-index:2;background:linear-gradient(180deg,#0f0b1499,transparent 35%,#0f0b14dc);display:none}
body.video.connected #shade{display:block}
#identity{z-index:6;top:22%}
#portraitWrapper{position:relative;width:min(42vw,156px);height:min(42vw,156px);margin:0 auto 24px}
#portraitWrapper #portrait{width:100%;height:100%;margin:0;border:2px solid #856f7d88;box-shadow:0 12px 35px #0008;z-index:2}
.pulse-ring{position:absolute;inset:-12px;border:1.5px solid #b95c7b88;border-radius:50%;pointer-events:none;animation:relaxiaPulse 2.8s ease-out infinite}
.pulse-ring:nth-child(2){animation-delay:.9s}
.pulse-ring:nth-child(3){animation-delay:1.8s}
@keyframes relaxiaPulse{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.72);opacity:0}}
#identity .peer-row{display:flex;justify-content:center;align-items:center;gap:8px}
#verifiedBadge,.top-verified{color:#d886a0;font-weight:700;font-size:20px}
#substate{margin-top:5px;color:#c7afb9;font-size:14px}
#topBar{position:absolute;top:max(18px,env(safe-area-inset-top));left:16px;right:16px;z-index:10;display:none;align-items:center;justify-content:center;text-align:center}
body.video.connected #topBar{display:flex}
#topMeta{display:flex;flex-direction:column;gap:4px;align-items:center}
#topTimer{font-variant-numeric:tabular-nums;font-size:14px}
#signalIndicator{display:flex;align-items:end;gap:3px;height:14px}
#signalIndicator[hidden]{display:none}
#signalIndicator span{width:3px;border-radius:2px;background:#7b8b91}
#signalIndicator span:nth-child(1){height:4px}
#signalIndicator span:nth-child(2){height:7px}
#signalIndicator span:nth-child(3){height:10px}
#signalIndicator span:nth-child(4){height:13px}
#signalIndicator span.on{background:#22bb82}
#pipContainer{position:absolute;top:max(75px,calc(env(safe-area-inset-top) + 58px));right:16px;width:110px;height:150px;border:1.5px solid #ffffff50;border-radius:18px;box-shadow:0 12px 35px #0009;overflow:hidden;z-index:12;display:none;background:#111}
body.video.connected #pipContainer{display:block}
#pipContainer #local{position:absolute;inset:0;top:0;left:0;width:100%;height:100%;max-height:none;border:0;border-radius:0;object-fit:cover}
#pipSwitch{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);width:36px;height:36px;min-width:0;padding:0;border:1px solid #ffffff55;border-radius:50%;background:#000a;display:grid;place-items:center}
#pipSwitch svg{width:20px;height:20px}
body.video.connected #identity{display:none}
#controls{z-index:14;gap:12px;align-items:center}
body.video.connected #controls{left:14px;right:14px;bottom:max(20px,env(safe-area-inset-bottom));padding:10px 8px;border:1px solid #ffffff26;background:#171922c9;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:38px;gap:10px}
button .disc{background:#ffffff14;border-color:#ffffff35;border-radius:50%}
button[aria-pressed="true"] .disc{background:#8b304e}
#hangup .disc{background:#c64656;box-shadow:0 8px 20px #ac283c66}
html[data-theme="light"] body{background:radial-gradient(ellipse at 50% 30%,#f3e6ea,#ece8eb 68%,#e7e6ec);color:#201e25}
html[data-theme="light"] #substate{color:#675a62}
html[data-theme="light"] #topBar{color:#fff}
html[data-theme="light"] body.video.connected #controls{background:#151824de;color:#fff}
html[data-theme="light"] body.video.connected #controls button{color:#fff}
@media (prefers-reduced-motion:reduce){.pulse-ring{animation:none;opacity:.25}}

</style>
<div id="ambientBackdrop"><img id="ambientImg" alt="" hidden></div>
<video id="remote" autoplay playsinline></video><div id="shade"></div>
<header id="topBar"><div id="topMeta"><div><span class="top-name"></span><span class="top-verified" hidden aria-label="تم التحقق">✦</span></div><div style="display:flex;align-items:center;gap:9px"><span id="topTimer">00:00</span><span id="signalIndicator" title="جودة الاتصال التقديرية" hidden><span></span><span></span><span></span><span></span></span></div></div></header>
<div id="pipContainer"><video id="local" autoplay muted playsinline></video><button id="pipSwitch" aria-label="تبديل الكاميرا" type="button"><svg viewBox="0 0 24 24"><path d="M20 7a9 9 0 0 0-15-2L2 8m0-5v5h5M4 17a9 9 0 0 0 15 2l3-3m0 5v-5h-5"/></svg></button></div>
<div id="identity"><div id="portraitWrapper"><div class="pulse-ring"></div><div class="pulse-ring"></div><div class="pulse-ring"></div><div id="portrait"><span id="initial"></span><img id="avatar" alt="" hidden></div></div><div class="peer-row"><strong id="peerName"></strong><span id="verifiedBadge" hidden aria-label="تم التحقق">✦</span></div><div id="state">جارٍ الاتصال…</div><div id="substate">بانتظار الرد</div><div id="timer"></div></div>
<button id="resume">تشغيل الصوت</button>
<div id="controls">
<button id="mute" disabled aria-label="كتم الميكروفون" aria-pressed="false"><span class="disc"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg></span><span class="label">كتم</span></button>
<button id="speaker" aria-label="مكبر الصوت" aria-pressed="false"><span class="disc"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4zM15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></svg></span><span class="label">مكبر الصوت</span></button>
<button id="camera" disabled aria-label="الكاميرا" aria-pressed="false"><span class="disc"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="13" height="14" rx="3"/><path d="m15 9 7-4v14l-7-4"/></svg></span><span class="label">الكاميرا</span></button>
<button id="switch" disabled aria-label="تبديل الكاميرا"><span class="disc"><svg viewBox="0 0 24 24"><path d="M20 7a9 9 0 0 0-15-2L2 8m0-5v5h5M4 17a9 9 0 0 0 15 2l3-3m0 5v-5h-5"/></svg></span><span class="label">تبديل</span></button>
<button id="hangup" aria-label="إنهاء المكالمة"><span class="disc"><svg viewBox="0 0 24 24"><path d="M3 16v-5c5-5 13-5 18 0v5l-5-1v-4M8 11v4z"/></svg></span><span class="label">إنهاء</span></button>
</div>
{{ config|json_script:"config" }}
<script nonce="{{ nonce }}">
'use strict';
const config=JSON.parse(document.getElementById('config').textContent),statusEl=document.getElementById('state'),remote=document.getElementById('remote'),local=document.getElementById('local');
document.getElementById('initial').textContent=(config.peerName||'').trim().slice(0,1);document.getElementById('peerName').textContent=config.peerName;document.querySelector('.top-name').textContent=config.peerName;document.getElementById('verifiedBadge').hidden=!config.peerVerified;document.querySelector('.top-verified').hidden=!config.peerVerified;
if(config.peerAvatar&&/^https:\/\//.test(config.peerAvatar)){const img=document.getElementById('avatar');img.onload=()=>img.hidden=false;img.src=config.peerAvatar;const ambient=document.getElementById('ambientImg');ambient.onload=()=>ambient.hidden=false;ambient.src=config.peerAvatar}
if(config.video)document.body.classList.add('video');
let pc,stream,stopped=false,after=0,started=null,videoFacing='user',switching=false,revision=0,remoteRevision=-1,restarting=false,lastRestart=0,reconnectSince=0,pendingSdp=null;
const queued=[],outgoingIce=[],path='/api/calls/'+config.call+'/signal';
async function api(method='GET',body){const abort=new AbortController(),timeout=setTimeout(()=>abort.abort(),8000);try{const response=await fetch(path+(method==='GET'?'?after='+after:''),{method,headers:{'X-Call-Token':config.token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store',signal:abort.signal});if(!response.ok)throw Error('network');return response.json()}finally{clearTimeout(timeout)}}
async function send(kind,data){await api('POST',{kind,data})}
async function sdp(kind,data){pendingSdp={kind,data};await send(kind,data);pendingSdp=null}
function state(message){if(!stopped){statusEl.textContent=message;document.getElementById('substate').textContent=message.includes('اتصال')?'بانتظار الرد':''}}
function finish(message){if(stopped)return;stopped=true;statusEl.textContent=message;if(stream)stream.getTracks().forEach(t=>t.stop());if(pc)pc.close();remote.srcObject=null;local.srcObject=null;document.body.classList.remove('connected');document.querySelectorAll('#controls button:not(#hangup)').forEach(b=>b.disabled=true)}
async function flush(){for(let i=queued.length-1;i>=0;i--){const item=queued[i];if(item.revision<remoteRevision){queued.splice(i,1);continue}if(item.revision===remoteRevision&&pc.remoteDescription){await pc.addIceCandidate(item.data);queued.splice(i,1)}}}
async function restart(){if(stopped||restarting||!pc||pc.signalingState!=='stable'||Date.now()-lastRestart<5000||revision>=8)return;restarting=true;lastRestart=Date.now();state('إعادة الاتصال…');try{if(config.caller){revision++;const offer=await pc.createOffer({iceRestart:true});await pc.setLocalDescription(offer);await sdp('offer',{type:pc.localDescription.type,sdp:pc.localDescription.sdp,revision})}else await send('reconnect',{})}catch(e){state('الشبكة ضعيفة · إعادة الاتصال…')}finally{restarting=false}}
async function poll(){let failures=0;while(!stopped){try{if(pendingSdp){await send(pendingSdp.kind,pendingSdp.data);pendingSdp=null}const result=await api();failures=0;if(!['ringing','accepted'].includes(result.status)){finish(result.status==='rejected'?'تم رفض الاتصال':result.status==='missed'?'لم يتم الرد':'انتهت المكالمة');break}if(result.status==='ringing')state(result.ringing_at?'يرن… بانتظار الرد':'جارٍ الاتصال…');else if(pc.connectionState!=='connected')state(reconnectSince?'إعادة الاتصال…':'جارٍ ربط الاتصال…');for(const e of result.events){const rev=e.data.revision||0;if(e.kind==='offer'&&!config.caller){revision=rev;await pc.setRemoteDescription(e.data);remoteRevision=rev;await flush();const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await sdp('answer',{type:pc.localDescription.type,sdp:pc.localDescription.sdp,revision:rev})}else if(e.kind==='answer'&&config.caller&&rev===revision){await pc.setRemoteDescription(e.data);remoteRevision=rev;await flush()}else if(e.kind==='ice'){if(rev===remoteRevision&&pc.remoteDescription)await pc.addIceCandidate(e.data);else if(rev>=remoteRevision)queued.push({revision:rev,data:e.data})}else if(e.kind==='reconnect'&&config.caller)await restart();after=e.id}
while(outgoingIce.length){await send('ice',outgoingIce[0]);outgoingIce.shift()}
if(pc.connectionState==='connected')state('متصل');
}catch(e){state('إعادة الاتصال… تحقق من الشبكة');if(++failures>=12){finish('تعذّر استعادة الاتصال. حاول مجددًا.');break}}
if(reconnectSince&&Date.now()-reconnectSince>35000){finish('تعذّر استعادة الاتصال. حاول مجددًا.');break}if(reconnectSince)await restart();await new Promise(r=>setTimeout(r,900))}}
(async()=>{try{if(!navigator.mediaDevices||!window.RTCPeerConnection)throw Error('unsupported');stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:config.video?{facingMode:'user',width:{ideal:640},height:{ideal:480},frameRate:{ideal:20,max:24}}:false});if(stopped){stream.getTracks().forEach(t=>t.stop());return}local.srcObject=stream;local.style.display=config.video?'block':'none';pc=new RTCPeerConnection({iceServers:config.iceServers,iceTransportPolicy:config.relayOnly?'relay':'all'});stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.onicecandidate=e=>{if(e.candidate&&outgoingIce.length<200)outgoingIce.push({...e.candidate.toJSON(),revision})};pc.ontrack=e=>{remote.srcObject=e.streams[0];remote.play().catch(()=>document.getElementById('resume').style.display='block')};pc.onconnectionstatechange=()=>{if(stopped)return;if(pc.connectionState==='connected'){state('متصل');document.body.classList.add('connected');started=started||Date.now();reconnectSince=0}else if(['disconnected','failed'].includes(pc.connectionState)){state('إعادة الاتصال…');reconnectSince=reconnectSince||Date.now();setTimeout(()=>restart(),1500)}};document.getElementById('mute').disabled=false;if(config.video){for(const id of ['camera','switch']){document.getElementById(id).style.display='flex';document.getElementById(id).disabled=false}}state(config.caller?'جارٍ الاتصال… بانتظار الرد':'جارٍ ربط الاتصال…');if(config.caller){const offer=await pc.createOffer();await pc.setLocalDescription(offer);pendingSdp={kind:'offer',data:{type:pc.localDescription.type,sdp:pc.localDescription.sdp,revision}}}poll()}catch(e){finish(e.name==='NotAllowedError'?'اسمح باستخدام الميكروفون والكاميرا للاتصال.':'تعذّر تشغيل الاتصال. تحقق من الأذونات وAndroid System WebView.')}})();
document.getElementById('mute').onclick=()=>{const t=stream?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;document.getElementById('mute').setAttribute('aria-pressed',String(!t.enabled));document.querySelector('#mute .label').textContent=t.enabled?'كتم':'تشغيل الميكروفون'}};
document.getElementById('camera').onclick=()=>{const t=stream?.getVideoTracks()[0];if(t){t.enabled=!t.enabled;local.style.visibility=t.enabled?'visible':'hidden';document.getElementById('camera').setAttribute('aria-pressed',String(!t.enabled));document.querySelector('#camera .label').textContent=t.enabled?'الكاميرا':'تشغيل الكاميرا'}};
document.getElementById('pipSwitch').onclick=()=>document.getElementById('switch').click();
document.getElementById('switch').onclick=async()=>{if(switching||stopped)return;switching=true;try{const facing=videoFacing==='user'?'environment':'user',replacement=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{exact:facing},width:{ideal:640},height:{ideal:480}}});if(stopped){replacement.getTracks().forEach(t=>t.stop());return}const old=stream.getVideoTracks()[0],track=replacement.getVideoTracks()[0],sender=pc.getSenders().find(s=>s.track&&s.track.kind==='video');track.enabled=old.enabled;await sender.replaceTrack(track);stream.removeTrack(old);old.stop();stream.addTrack(track);local.srcObject=stream;videoFacing=facing;local.style.transform=facing==='user'?'scaleX(-1)':'none'}catch(e){document.querySelector('#switch .label').textContent='غير متاحة'}finally{switching=false}};
document.getElementById('speaker').onclick=()=>{if(window.LayaliCall){window.LayaliCall.toggleSpeaker()}else{document.querySelector('#speaker .label').textContent='الصوت من الجهاز'}};
window.updateSpeaker=value=>document.getElementById('speaker').setAttribute('aria-pressed',String(value));
document.getElementById('hangup').onclick=async()=>{try{await send('hangup',{})}catch(e){}finish('انتهت المكالمة');if(window.LayaliCall)window.LayaliCall.endCall()};
document.getElementById('resume').onclick=()=>remote.play().then(()=>document.getElementById('resume').style.display='none').catch(()=>{});
setInterval(()=>{if(started&&!stopped){const n=Math.floor((Date.now()-started)/1000);const elapsed=Math.floor(n/60)+':'+String(n%60).padStart(2,'0');document.getElementById('timer').textContent=elapsed;document.getElementById('topTimer').textContent=elapsed}},1000);

/* Only show quality bars after a real RTT sample, never decorative green bars. */
setInterval(async()=>{
 if(!pc||stopped||pc.connectionState!=='connected')return;
 try{
  const stats=await pc.getStats();let rtt;
  stats.forEach(v=>{
   if(v.type==='candidate-pair'&&v.state==='succeeded'&&v.nominated&&typeof v.currentRoundTripTime==='number')
    rtt=v.currentRoundTripTime;
  });
  if(rtt===undefined)return;
  const bars=document.getElementById('signalIndicator');bars.hidden=false;
  const level=rtt<0.15?4:rtt<0.3?3:rtt<0.6?2:1;
  Array.from(bars.children).forEach((bar,i)=>bar.classList.toggle('on',i<level));
 }catch(_){}
},3000);
window.addEventListener('pagehide',()=>finish('انتهت المكالمة'));window.addEventListener('beforeunload',()=>finish('انتهت المكالمة'));
</script></html>
