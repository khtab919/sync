<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>اتصال Relaxia</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#281b27;color:#fff;font-family:system-ui,sans-serif;height:100dvh;overflow:hidden}#remote{width:100%;height:100%;object-fit:cover;background:radial-gradient(ellipse at top,#62364e,#281b27)}#local{position:absolute;top:16px;left:16px;width:28%;max-height:27%;border-radius:20px;object-fit:cover;box-shadow:0 5px 30px #0008;transform:scaleX(-1)}#state{position:absolute;top:45%;left:12%;right:12%;text-align:center;font-size:22px;text-shadow:0 1px 8px #000}#identity{position:absolute;top:25%;left:10%;right:10%;text-align:center;display:none}#identity span{display:grid;place-items:center;margin:auto auto 20px;width:100px;height:100px;border:1px solid #dba2bd;border-radius:50%;font-size:42px;background:linear-gradient(135deg,#b66588,#633149)}#identity strong{font-size:24px}#controls{position:absolute;bottom:28px;left:16px;right:16px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}button{border:0;border-radius:24px;padding:16px 22px;font-size:16px;background:#f3cfdf;color:#43263a}button:disabled{opacity:.45}#timer{position:absolute;top:20px;right:20px;border-radius:20px;background:#281b2799;padding:8px 14px}#resume{display:none;background:#fff}#camera{display:none}#state.small{top:16px;font-size:15px}
</style>
<video id="remote" autoplay playsinline></video><video id="local" autoplay muted playsinline></video><div id="identity"><span id="initial"></span><strong id="peerName"></strong></div><div id="timer"></div><div id="state">جارٍ فتح الاتصال…</div><div id="controls"><button id="resume">تشغيل الصوت</button><button id="mute" disabled>كتم الصوت</button><button id="camera" disabled>إيقاف الكاميرا</button><button id="switch" disabled style="display:none">تبديل الكاميرا</button></div>
{{ config|json_script:"config" }}
<script nonce="{{ nonce }}">
'use strict';
const config=JSON.parse(document.getElementById('config').textContent), statusEl=document.getElementById('state'), remote=document.getElementById('remote'), local=document.getElementById('local');
if(!config.video){document.getElementById('identity').style.display='block';document.getElementById('initial').textContent=(config.peerName||'R').trim().slice(0,1);document.getElementById('peerName').textContent=config.peerName;statusEl.style.top='60%'}
let pc,stream,stopped=false,after=0,started=null,videoFacing='user',switching=false,disconnectTimer=null;
const queued=[],path='/api/calls/'+config.call+'/signal';
async function api(method='GET',body){
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),8000);
 try{const response=await fetch(path+(method==='GET'?'?after='+after:''),{method,headers:{'X-Call-Token':config.token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store',signal:controller.signal});if(!response.ok){const error=Error('network');error.status=response.status;throw error}return await response.json()}
 finally{clearTimeout(timeout)}
}
async function send(kind,data){
 // Only ICE candidates can be safely retried. Offers and answers remain single submissions.
 for(let attempt=0;!stopped;attempt++){
  try{await api('POST',{kind,data});return}
  catch(e){if(kind!=='ice'||attempt>=2||(e.status&&e.status<500))throw e;await new Promise(r=>setTimeout(r,500*(attempt+1)))}
 }
}
function finish(message){if(stopped)return;stopped=true;clearTimeout(disconnectTimer);statusEl.classList.remove('small');statusEl.textContent=message;if(stream)stream.getTracks().forEach(t=>t.stop());if(pc)pc.close();remote.srcObject=null;local.srcObject=null;document.querySelectorAll('#controls button').forEach(b=>b.disabled=true)}
async function flush(){while(queued.length&&pc.remoteDescription)await pc.addIceCandidate(queued.shift())}
async function poll(){let failures=0,outageSince=null;while(!stopped){try{const result=await api();if(failures&&pc.connectionState==='connected')statusEl.textContent='متصل';failures=0;outageSince=null;if(!['ringing','accepted'].includes(result.status)){finish(result.status==='rejected'?'تم رفض الاتصال':result.status==='missed'?'لم يتم الرد':'انتهى الاتصال');break}if(result.status==='ringing')statusEl.textContent='جارٍ الاتصال… بانتظار الرد';for(const e of result.events){if(e.kind==='offer'&&!config.caller){await pc.setRemoteDescription(e.data);await flush();const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await send('answer',{type:pc.localDescription.type,sdp:pc.localDescription.sdp})}else if(e.kind==='answer'&&config.caller){await pc.setRemoteDescription(e.data);await flush()}else if(e.kind==='ice'){if(pc.remoteDescription)await pc.addIceCandidate(e.data);else queued.push(e.data)}after=e.id}}catch(e){if(stopped)break;if(e.status===401||e.status===403||e.status===404){finish('انتهت صلاحية الاتصال. أعد فتح المكالمة.');break}failures++;outageSince=outageSince||Date.now();statusEl.textContent='الاتصال بالخادم ضعيف… جارٍ إعادة المحاولة';if(Date.now()-outageSince>=45000){finish('تعذّر استعادة الاتصال بالخادم. أغلق المكالمة وأعد المحاولة.');break}}await new Promise(r=>setTimeout(r,failures?Math.min(4000,900*failures):900))}}
(async()=>{try{if(!navigator.mediaDevices||!window.RTCPeerConnection)throw Error('unsupported');stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:config.video?{facingMode:'user',width:{ideal:640},height:{ideal:480},frameRate:{ideal:20,max:24}}:false});if(stopped){stream.getTracks().forEach(t=>t.stop());return}local.srcObject=stream;local.style.display=config.video?'block':'none';pc=new RTCPeerConnection({iceServers:config.iceServers,iceTransportPolicy:config.relayOnly?'relay':'all'});stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.onicecandidate=e=>{if(e.candidate)send('ice',e.candidate.toJSON()).catch(()=>finish('تعذّر إرسال بيانات الاتصال. أعد المحاولة.'))};pc.ontrack=e=>{remote.srcObject=e.streams[0];remote.play().catch(()=>document.getElementById('resume').style.display='block')};pc.onconnectionstatechange=()=>{if(pc.connectionState==='connected'){clearTimeout(disconnectTimer);disconnectTimer=null;statusEl.textContent='متصل';statusEl.classList.add('small');started=started||Date.now()}else if(pc.connectionState==='disconnected'){statusEl.textContent='الشبكة ضعيفة… جارٍ استعادة الاتصال';if(!disconnectTimer)disconnectTimer=setTimeout(()=>{if(!stopped&&pc.connectionState!=='connected')finish('لم يُستعد اتصال الصوت والصورة. أعد المكالمة.')},20000)}else if(pc.connectionState==='failed')finish('تعذّر تمرير الصوت والصورة. تحقق من إعدادات خادم الاتصال.')};document.getElementById('mute').disabled=false;if(config.video){document.getElementById('camera').style.display='block';document.getElementById('camera').disabled=false;document.getElementById('switch').style.display='block';document.getElementById('switch').disabled=false}statusEl.textContent=config.caller?'جارٍ الاتصال… بانتظار الرد':'جارٍ ربط الاتصال…';if(config.caller){const offer=await pc.createOffer();await pc.setLocalDescription(offer);await send('offer',{type:pc.localDescription.type,sdp:pc.localDescription.sdp})}poll()}catch(e){finish(e.name==='NotAllowedError'?'اسمح باستخدام الميكروفون والكاميرا للاتصال.':'تعذّر تشغيل الاتصال. تحقق من أذونات الجهاز وتحديث Android System WebView.')}})();
document.getElementById('mute').onclick=()=>{const t=stream.getAudioTracks()[0];if(t){t.enabled=!t.enabled;document.getElementById('mute').textContent=t.enabled?'كتم الصوت':'تشغيل الصوت'}};
document.getElementById('camera').onclick=()=>{const t=stream.getVideoTracks()[0];if(t){t.enabled=!t.enabled;local.style.visibility=t.enabled?'visible':'hidden';document.getElementById('camera').textContent=t.enabled?'إيقاف الكاميرا':'تشغيل الكاميرا'}};
document.getElementById('switch').onclick=async()=>{if(switching||stopped)return;switching=true;try{const facing=videoFacing==='user'?'environment':'user',replacement=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{exact:facing},width:{ideal:640},height:{ideal:480}}});if(stopped){replacement.getTracks().forEach(t=>t.stop());return}const old=stream.getVideoTracks()[0],track=replacement.getVideoTracks()[0],sender=pc.getSenders().find(s=>s.track&&s.track.kind==='video');track.enabled=old.enabled;await sender.replaceTrack(track);stream.removeTrack(old);old.stop();stream.addTrack(track);local.srcObject=stream;videoFacing=facing;local.style.transform=facing==='user'?'scaleX(-1)':'none'}catch(e){document.getElementById('switch').textContent='الكاميرا الأخرى غير متاحة'}finally{switching=false}};
document.getElementById('resume').onclick=()=>remote.play().then(()=>document.getElementById('resume').style.display='none').catch(()=>{});
setInterval(()=>{if(started&&!stopped){const n=Math.floor((Date.now()-started)/1000);document.getElementById('timer').textContent=Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}},1000);
window.addEventListener('pagehide',()=>finish('انتهى الاتصال'));window.addEventListener('beforeunload',()=>finish('انتهى الاتصال'));
</script></html>
