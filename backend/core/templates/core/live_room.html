<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>البث المباشر</title>
<style>*{box-sizing:border-box}body{margin:0;background:#171517;color:#f6f0ee;font:15px system-ui,sans-serif;height:100dvh;overflow:hidden}#video{position:absolute;inset:0}#video video{width:100%;height:100%;object-fit:contain}header{position:absolute;top:0;left:0;right:0;padding:18px;background:linear-gradient(#171517dd,transparent);display:flex;align-items:center;gap:12px}header div{flex:1}h1{font-size:17px;margin:0 0 4px}#status{font-size:12px;color:#d9c6cc}button{font:inherit;border:0;border-radius:18px;background:#5e414b;color:white;padding:10px 14px;cursor:pointer}button:disabled{opacity:.4}#messages{position:absolute;bottom:130px;right:16px;left:16px;max-height:23vh;overflow:auto;text-shadow:0 1px 3px #000}#messages p{margin:6px 0;padding:6px 10px;background:#17151788;border-radius:12px;width:fit-content;max-width:90%;overflow-wrap:anywhere}footer{position:absolute;bottom:0;left:0;right:0;padding:12px 14px max(12px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#171517e8)}#actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:10px}#composer{display:flex;gap:8px}input{min-width:0;flex:1;border:1px solid #a78d9555;border-radius:20px;background:#2c2529dd;color:white;font:inherit;padding:11px}#viewers{white-space:nowrap;font-size:13px}#ended{position:absolute;inset:0;display:none;place-items:center;text-align:center;background:#171517e8;padding:24px}#participants{position:absolute;top:90px;right:16px;max-height:25vh;overflow:auto;background:#211b20;border-radius:16px;padding:12px;display:none}#ownerControls{display:none;gap:6px;flex-wrap:wrap;max-width:100%}#note{font-size:11px;opacity:.75;margin-top:8px}#hide{background:#43343b}</style>
<div id="video"></div><header><img id="ownerAvatar" hidden style="width:36px;height:36px;border-radius:50%;object-fit:cover" alt=""><div><h1 id="name"></h1><span id="status">جارٍ الاتصال…</span></div><span id="viewers">0 مشاهد</span><button id="exit">خروج</button></header><div id="participants"></div><div id="messages"></div><footer><div id="actions"><div id="ownerControls"><button id="mute">كتم</button><button id="camera">الكاميرا</button><button id="switch">تبديل</button><button id="people">المشاهدون</button><button id="end">إنهاء البث</button></div><button id="like">إعجاب</button><button id="follow">متابعة</button><button id="hide">إخفاء التعليقات</button><button id="gift" hidden>هدية</button><button id="report">إبلاغ</button></div><form id="composer"><input id="text" maxlength="300" placeholder="اكتب تعليقًا…" autocomplete="off"><button>إرسال</button></form><div id="note">بث مباشر دون تسجيل أو إعادة مشاهدة داخل المنصة.</div></footer><div id="ended"></div>
{{ config|json_script:"config" }}
<script src="/static/core/livekit-client.umd.min.js"></script><script nonce="{{ nonce }}">
'use strict';
const config=JSON.parse(document.getElementById('config').textContent),statusEl=document.getElementById('status'),video=document.getElementById('video');
const {Room,RoomEvent,Track,ConnectionState}=LivekitClient;
let room,closed=false,muted=false,cameraOff=false,facing='user',commentsVisible=true,lastComments='',leaving=false,retrying=false,polling=false;
const path='/api/live/'+config.id+'/control';
document.getElementById('name').textContent=config.ownerName+' · '+config.title;
if(config.ownerAvatar&&/^https:\/\//.test(config.ownerAvatar)){const a=document.getElementById('ownerAvatar');a.onload=()=>a.hidden=false;a.src=config.ownerAvatar}
if(!config.owner&&window.LayaliLive&&window.LayaliLive.canOpenProfile()){document.getElementById('name').style.cursor='pointer';document.getElementById('name').onclick=()=>window.LayaliLive.openProfile(config.ownerId)}
async function api(action){const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),8000);try{const r=await fetch(path,{method:action?'POST':'GET',headers:{'Content-Type':'application/json','X-Live-Control':config.control},body:action?JSON.stringify(action):undefined,signal:abort.signal,cache:'no-store'});const value=await r.json();if(!r.ok)throw Error(value.error||'network');return value}finally{clearTimeout(timer)}}
function message(e){statusEl.textContent=e.message==='insufficient_balance'?'الرصيد غير كافٍ':e.message==='broadcast_ended'?'انتهى البث':'تعذّر تنفيذ الطلب. تحقق من الاتصال.'}
function stop(label){if(closed)return;closed=true;room?.disconnect();document.getElementById('ended').style.display='grid';document.getElementById('ended').textContent=label;document.querySelectorAll('footer button,footer input').forEach(el=>el.disabled=true);video.replaceChildren()}
function leave(){leaving=true;closed=true;room?.disconnect();if(window.LayaliLive)window.LayaliLive.closeRoom();else stop('غادرت البث')}
async function connect(token=config.token){room=new Room({adaptiveStream:true,dynacast:true,videoCaptureDefaults:{resolution:{width:640,height:360,frameRate:20},facingMode:'user'},publishDefaults:{simulcast:true}});
room.on(RoomEvent.TrackSubscribed,(track)=>{if(track.kind===Track.Kind.Video||track.kind===Track.Kind.Audio){const el=track.attach();el.controls=false;el.autoplay=true;el.playsInline=true;el.addEventListener('contextmenu',e=>e.preventDefault());video.appendChild(el)}});
room.on(RoomEvent.TrackUnsubscribed,track=>track.detach().forEach(el=>el.remove()));
room.on(RoomEvent.ConnectionStateChanged,state=>{statusEl.textContent=state===ConnectionState.Connected?'مباشر':state===ConnectionState.Reconnecting?'إعادة الاتصال…':'جارٍ الاتصال…'});
room.on(RoomEvent.ConnectionQualityChanged,(quality,participant)=>{if(participant===room.localParticipant&&String(quality).toLowerCase()==='poor')statusEl.textContent='الشبكة ضعيفة · خفض الجودة تلقائيًا'});
room.on(RoomEvent.Disconnected,()=>{if(!closed&&!leaving)reconnect()});
await room.connect(config.url,token);
if(config.owner){document.getElementById('ownerControls').style.display='flex';document.getElementById('follow').hidden=true;await room.localParticipant.setMicrophoneEnabled(!muted);await room.localParticipant.setCameraEnabled(!cameraOff);const publication=room.localParticipant.getTrackPublication(Track.Source.Camera);if(publication?.track){const el=publication.track.attach();el.muted=true;el.controls=false;el.playsInline=true;el.style.transform='scaleX(-1)';video.appendChild(el)}}
if(config.gifts&&!config.owner)document.getElementById('gift').hidden=false;
if(!polling){polling=true;poll()}}
async function reconnect(){
 if(retrying||closed||leaving)return;retrying=true;
 try{
  for(let attempt=0;attempt<6&&!closed&&!leaving;attempt++){
   statusEl.textContent='إعادة الاتصال…';
   await new Promise(r=>setTimeout(r,Math.min(5000,1000*(attempt+1))));
   try{
    const fresh=await api({action:'token'});if(closed||leaving)return;
    room?.removeAllListeners();await room?.disconnect();video.replaceChildren();
    await connect(fresh.token);return;
   }catch(e){
    if(['broadcast_forbidden','broadcast_ended','live_authorization_required','admission_refunded'].includes(e.message)){stop('انتهت صلاحية مشاهدة البث');return}
   }
  }
  if(!closed&&!leaving)statusEl.textContent='تعذّر الاتصال. اخرج وأعد الدخول إلى البث نفسه دون خصم جديد.';
 }finally{retrying=false}
}
async function poll(){while(!closed){try{const result=await api();if(!['starting','active','reconnecting'].includes(result.status)){stop('انتهى البث');break}if(result.status==='reconnecting')statusEl.textContent='صاحب البث يعيد الاتصال…';else if(room.state===ConnectionState.Connected)statusEl.textContent='مباشر';document.getElementById('viewers').textContent=result.viewers+' مشاهد';document.getElementById('follow').textContent=result.following?'تتابعه':'متابعة';const fingerprint=JSON.stringify(result.comments);if(lastComments!==fingerprint){lastComments=fingerprint;const box=document.getElementById('messages');box.replaceChildren();for(const c of result.comments||[]){const p=document.createElement('p');const strong=document.createElement('strong');strong.textContent=c.name+': ';p.append(strong,document.createTextNode(c.text));box.appendChild(p)}box.scrollTop=box.scrollHeight}if(config.owner){const box=document.getElementById('participants');box.replaceChildren();for(const p of result.participants||[]){const row=document.createElement('p');row.append(document.createTextNode(p.name+' '));const ban=document.createElement('button');ban.textContent='طرد وحظر';ban.onclick=()=>{if(confirm('حظر '+p.name+' من هذا البث؟'))api({action:'ban',user_id:p.user_id}).catch(message)};row.appendChild(ban);box.appendChild(row)}}}catch(e){if(['broadcast_forbidden','broadcast_ended','live_authorization_required','admission_refunded'].includes(e.message)){stop('انتهت صلاحية مشاهدة البث');break}statusEl.textContent='إعادة الاتصال…'}await new Promise(r=>setTimeout(r,3000))}}
document.getElementById('composer').onsubmit=async e=>{e.preventDefault();const input=document.getElementById('text');if(!input.value.trim())return;try{await api({action:'comment',text:input.value});input.value=''}catch(e){message(e)}};
document.getElementById('mute').onclick=async()=>{muted=!muted;await room.localParticipant.setMicrophoneEnabled(!muted);document.getElementById('mute').textContent=muted?'تشغيل الميكروفون':'كتم'};
document.getElementById('camera').onclick=async()=>{cameraOff=!cameraOff;await room.localParticipant.setCameraEnabled(!cameraOff);document.getElementById('camera').textContent=cameraOff?'تشغيل الفيديو':'الكاميرا'};
document.getElementById('switch').onclick=async()=>{try{facing=facing==='user'?'environment':'user';await room.localParticipant.getTrackPublication(Track.Source.Camera)?.track?.restartTrack({facingMode:facing})}catch(e){statusEl.textContent='الكاميرا الأخرى غير متاحة'}};
document.getElementById('end').onclick=async()=>{if(confirm('إنهاء البث للجميع؟'))try{await api({action:'end'});stop('انتهى البث')}catch(e){message(e)}};
document.getElementById('exit').onclick=()=>{if(config.owner){if(confirm('مغادرة صاحب البث تنهي الجلسة. إنهاء؟'))api({action:'end'}).then(leave).catch(message)}else leave()};
document.getElementById('hide').onclick=()=>{commentsVisible=!commentsVisible;document.getElementById('messages').style.display=commentsVisible?'block':'none';document.getElementById('hide').textContent=commentsVisible?'إخفاء التعليقات':'إظهار التعليقات'};
document.getElementById('people').onclick=()=>{const el=document.getElementById('participants');el.style.display=el.style.display==='block'?'none':'block'};
document.getElementById('like').onclick=()=>api({action:'like'}).then(()=>document.getElementById('like').disabled=true).catch(message);
document.getElementById('follow').onclick=()=>api({action:'follow'}).catch(message);
document.getElementById('report').onclick=()=>{const reason=prompt('سبب الإبلاغ (3 أحرف على الأقل)');if(reason&&reason.trim().length>=3)api({action:'report',reason}).then(()=>statusEl.textContent='وصل البلاغ إلى الإدارة').catch(message)};
let giftKey=null;
document.getElementById('gift').onclick=async()=>{const amount=prompt('اختر قيمة الهدية: 100 أو 300 أو 1000 من الرصيد');if(!['100','300','1000'].includes(amount))return;if(!confirm('خصم '+amount+'؟ يحصل صاحب البث على 80٪، والهدية غير قابلة للاسترداد بعد إرسالها.'))return;const key=giftKey||(giftKey=crypto.randomUUID());try{await api({action:'gift',price_cents:Number(amount),confirmed:true,request_key:key});giftKey=null;statusEl.textContent='أُرسلت الهدية'}catch(e){message(e)}};
new ResizeObserver(entries=>{document.getElementById('messages').style.bottom=(entries[0].contentRect.height+30)+'px'}).observe(document.querySelector('footer'));
window.addEventListener('pagehide',()=>{leaving=true;room?.disconnect()});connect().catch(()=>reconnect());
</script></html>
